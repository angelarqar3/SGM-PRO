<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Proyectos HBQP - Gestión y Tablero Kanban</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { touch-action: manipulation; }
    input, textarea, select { font-size: 14px !important; }
    .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    body {
      background: #f1f5f9;
      color: #0f172a;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .kanban-col {
      min-height: calc(100vh - 270px);
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .kanban-cards-wrapper {
      min-height: 180px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 2px;
      border-radius: 10px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .kanban-cards-wrapper.drag-over {
      background-color: rgba(199, 210, 254, 0.6) !important;
      border: 2px dashed #4338ca !important;
    }

    .project-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 13px;
      box-shadow: 0 1px 3px rgba(15,23,42,.04);
      cursor: grab;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .project-card:hover {
      transform: translateY(-2px);
      border-color: #94a3b8;
      box-shadow: 0 8px 20px rgba(15,23,42,.08);
    }

    .project-card.dragging {
      opacity: 0.35;
      transform: scale(0.96);
    }

    .badge-proyecto { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .badge-reparacion { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
    .badge-apoyo { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <div id="toastContainer" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[70] flex flex-col gap-2 pointer-events-none"></div>

  <!-- Header Superior -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="window.pmApp.resetView()">
        <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-400/30 flex items-center justify-center text-indigo-400 text-lg">
          <i class="fa-solid fa-diagram-project"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="font-bold text-base tracking-wide text-white">Gestión de Proyectos</h1>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-400/30">HBQP</span>
          </div>
          <p class="text-xs text-slate-400">Infraestructura, Habilitaciones y Apoyo Técnico</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="window.pmApp.openNewProjectModal()" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow transition flex items-center gap-1.5">
          <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Nuevo Proyecto</span>
        </button>
        <button onclick="window.pmApp.exportCSV()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-bold transition flex items-center gap-1.5">
          <i class="fa-solid fa-file-csv"></i> <span class="hidden md:inline">Exportar CSV</span>
        </button>
        <button onclick="window.pmApp.generateExecutiveReportPDF()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-bold transition flex items-center gap-1.5">
          <i class="fa-solid fa-file-pdf"></i> <span class="hidden md:inline">Informe PDF</span>
        </button>
        <a href="https://docs.google.com/spreadsheets/d/1ecGqzStNN73u36JxXdhWF0ckjITwnQYQ65Hduh9UJjc/edit?gid=315884375" target="_blank" class="px-3 py-1.5 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-bold transition flex items-center gap-1.5">
          <i class="fa-solid fa-table"></i> <span class="hidden lg:inline">Google Sheet</span>
        </a>
      </div>
    </div>

    <!-- KPIs de Proyectos -->
    <div class="bg-slate-950/80 border-t border-slate-800 px-4 py-2 text-xs text-slate-300">
      <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-4 flex-wrap font-medium">
          <span>Total Proyectos: <strong id="stat-total" class="text-white font-bold">46</strong></span>
          <span class="text-slate-600">|</span>
          <span class="cursor-pointer hover:underline" onclick="window.pmApp.setFilterStatus('PENDIENTE')">
            <span class="inline-block w-2 h-2 rounded-full bg-amber-400 mr-1"></span> Pendientes: <strong id="stat-pending" class="text-amber-300 font-bold">22</strong>
          </span>
          <span class="cursor-pointer hover:underline" onclick="window.pmApp.setFilterStatus('Propuesta enviada')">
            <span class="inline-block w-2 h-2 rounded-full bg-blue-400 mr-1"></span> Propuesta Enviada: <strong id="stat-propuesta" class="text-blue-300 font-bold">6</strong>
          </span>
          <span class="cursor-pointer hover:underline" onclick="window.pmApp.setFilterStatus('EN PROCESO')">
            <span class="inline-block w-2 h-2 rounded-full bg-indigo-400 mr-1"></span> En Proceso / Obras: <strong id="stat-process" class="text-indigo-300 font-bold">1</strong>
          </span>
          <span class="cursor-pointer hover:underline" onclick="window.pmApp.setFilterStatus('TERMINADO')">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 mr-1"></span> Concluidos: <strong id="stat-done" class="text-emerald-300 font-bold">17</strong>
          </span>
        </div>
      </div>
    </div>
  </header>

  <!-- Filtros y Vistas -->
  <section class="bg-white border-b border-slate-200 px-4 py-3 shadow-sm sticky top-[98px] z-20">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="relative flex-1 min-w-[240px]">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input type="text" id="searchInput" oninput="window.pmApp.render()" placeholder="Buscar por requerimiento, recinto, unidad, solicitante, PMA..." 
               class="w-full pl-8 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>

      <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs font-bold">
        <button id="btnViewKanban" onclick="window.pmApp.setViewMode('kanban')" class="px-3 py-1.5 rounded-md bg-white text-indigo-600 shadow-sm">
          <i class="fa-solid fa-table-columns mr-1"></i> Kanban
        </button>
        <button id="btnViewCards" onclick="window.pmApp.setViewMode('cards')" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900">
          <i class="fa-solid fa-grip mr-1"></i> Cuadrícula
        </button>
        <button id="btnViewTable" onclick="window.pmApp.setViewMode('table')" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900">

      </div>

      <div class="flex items-center flex-wrap gap-2 text-xs">
        <select id="filterTipologia" onchange="window.pmApp.render()" class="bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 font-medium text-slate-700">
          <option value="">Todas las Tipologías</option>
          <option value="PROYECTO">Proyecto</option>
          <option value="REPARACION">Reparación</option>
          <option value="APOYO TECNICO">Apoyo Técnico</option>

        <select id="filterPiso" onchange="window.pmApp.render()" class="bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 font-medium text-slate-700">
          <option value="">Todos los Pisos</option>
          <option value="-1">Piso -1 (Subsuelo)</option>
          <option value="1">Piso 1</option>
          <option value="2">Piso 2</option>
          <option value="3">Piso 3</option>
          <option value="4">Piso 4</option>
          <option value="5">Piso 5</option>
          <option value="6">Piso 6</option>
          <option value="7">Piso 7</option>
        </select>

        <select id="filterPrioridad" onchange="window.pmApp.render()" class="bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 font-medium text-slate-700">
          <option value="">Todas las Prioridades</option>
          <option value="MUY ALTA">Muy Alta</option>
          <option value="ALTA">Alta</option>
          <option value="MEDIA">Media</option>
          <option value="BAJA">Baja</option>
        </select>

        <button onclick="window.pmApp.clearFilters()" class="text-slate-500 hover:text-slate-800 p-1.5 rounded-lg border border-slate-200">
          <i class="fa-solid fa-filter-circle-xmark"></i>
        </button>
      </div>
    </div>
  </section>

  <!-- Contenedor Principal -->
  <main id="mainContainer" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 overflow-x-auto"></main>

  <!-- Modal Ficha Técnica del Proyecto -->
  <div id="projectModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-3xl w-full shadow-2xl overflow-hidden border border-slate-200 my-6 max-h-[92vh] flex flex-col">
      <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-indigo-600/30 flex items-center justify-center text-indigo-300">
            <i class="fa-solid fa-folder-open"></i>
          </div>
          <div>
            <h3 id="modalProjectTitle" class="font-bold text-base leading-tight">Ficha Técnica de Proyecto</h3>
            <p id="modalProjectSubtitle" class="text-xs text-slate-400">Detalle arquitectónico y especificaciones</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" id="btnShareWhatsAppModal" class="px-2.5 py-1.5 bg-[#25D366] hover:bg-[#20bd5a] text-white text-xs font-bold rounded-lg shadow-sm flex items-center gap-1">
            <i class="fa-brands fa-whatsapp text-sm"></i> <span>WhatsApp</span>
          </button>
          <button onclick="window.pmApp.closeModal()" class="text-slate-400 hover:text-white transition text-lg p-1">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <form id="projectForm" onsubmit="window.pmApp.saveProject(event)" class="p-6 space-y-4 text-xs overflow-y-auto custom-scroll flex-1">
        <input type="hidden" id="formProjectId">

        <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
          <div>
            <label class="block font-bold text-slate-700 mb-1">Código Proyecto</label>
            <input type="text" id="formCodigo" required class="w-full border border-slate-300 rounded-lg p-2 bg-white font-bold text-indigo-700">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">N° Ticket / OC</label>
            <input type="text" id="formTicket" placeholder="Ej. #66458 o OC..." class="w-full border border-slate-300 rounded-lg p-2 bg-white">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">Tipología *</label>
            <select id="formTipologia" required class="w-full border border-slate-300 rounded-lg p-2 bg-white font-semibold">
              <option value="PROYECTO">PROYECTO</option>
              <option value="REPARACION">REPARACIÓN</option>
              <option value="APOYO TECNICO">APOYO TÉCNICO</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">Prioridad *</label>
            <select id="formPrioridad" required class="w-full border border-slate-300 rounded-lg p-2 bg-white font-semibold">
              <option value="MUY ALTA">🚨 Muy Alta</option>
              <option value="ALTA">🟠 Alta</option>
              <option value="MEDIA" selected>🟡 Media</option>
              <option value="BAJA">🟢 Baja</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Requerimiento / Asunto del Proyecto *</label>
          <textarea id="formRequerimiento" rows="2" required placeholder="Nombre descriptivo del proyecto..." class="w-full border border-slate-300 rounded-lg p-2 bg-white font-medium"></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">Unidad Solicitante</label>
            <input type="text" id="formUnidad" placeholder="Ej. Subdirección de Operaciones..." class="w-full border border-slate-300 rounded-lg p-2 bg-white">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">Solicitante (Persona / Cargo)</label>
            <input type="text" id="formSolicitante" placeholder="Nombre de quien solicita..." class="w-full border border-slate-300 rounded-lg p-2 bg-white">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">Piso</label>
            <input type="text" id="formPiso" placeholder="Ej. -1, 1, 2, 3..." class="w-full border border-slate-300 rounded-lg p-2 bg-white">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">Recinto / Emplazamiento</label>
            <input type="text" id="formUbicacion" placeholder="Ej. Terraza, Box..." class="w-full border border-slate-300 rounded-lg p-2 bg-white">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">Código PMA</label>
            <input type="text" id="formPMA" placeholder="Ej. D-3-40, G-S1-45" class="w-full border border-slate-300 rounded-lg p-2 bg-white">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-indigo-50/50 p-3 rounded-xl border border-indigo-100">
          <div>
            <label class="block font-bold text-indigo-900 mb-1">Fase / Estado del Proyecto *</label>
            <select id="formEstado" required class="w-full border border-indigo-200 rounded-lg p-2 bg-white font-bold text-indigo-950">
              <option value="PENDIENTE">📋 Pendiente / En Evaluación</option>
              <option value="Propuesta enviada">📑 Propuesta Enviada</option>
              <option value="EN PROCESO">🏗️ En Proceso / En Obras</option>
              <option value="TERMINADO">✅ Concluido / Entregado</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-indigo-900 mb-1">Fecha de Ingreso</label>
            <input type="date" id="formFechaIngreso" class="w-full border border-indigo-200 rounded-lg p-2 bg-white">
          </div>
          <div>
            <label class="block font-bold text-indigo-900 mb-1">Última Actualización</label>
            <input type="date" id="formFechaActualizacion" class="w-full border border-indigo-200 rounded-lg p-2 bg-white">
          </div>
        </div>

        <div>
          <label class="block font-bold text-amber-900 mb-1">Acción Pendiente / Próximo Hito Bloqueante</label>
          <input type="text" id="formPendiente" placeholder="Ej: Control Centralizado envía EE.TT., Reunión 07/JULIO..." class="w-full border border-amber-300 bg-amber-50/60 rounded-lg p-2 text-amber-950 font-semibold">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Memoria Descriptiva y Especificaciones Técnicas</label>
          <textarea id="formDescripcion" rows="4" placeholder="Detalle técnico de los trabajos, materiales, requerimientos de arquitectura..." class="w-full border border-slate-300 rounded-lg p-2 bg-white"></textarea>
        </div>

        <div class="pt-4 border-t border-slate-200 flex items-center justify-between">
          <button type="button" id="btnDeleteProject" onclick="window.pmApp.deleteProject()" class="text-rose-600 hover:text-rose-800 font-bold flex items-center gap-1">
            <i class="fa-solid fa-trash-can"></i> Eliminar Proyecto
          </button>
          <div class="flex items-center gap-2">
            <button type="button" onclick="window.pmApp.closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-100 font-bold">
              Cancelar
            </button>
            <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-bold shadow flex items-center gap-1.5">
              <i class="fa-solid fa-floppy-disk"></i> Guardar Proyecto
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SGM_CONFIG = {
      supabaseUrl: "https://xtrzyioxbanyjvjeqedw.supabase.co",
      supabaseAnonKey: "sb_publishable__rmY-7gpN8Ijh7Bn5e9HtA_Bu6Z4Yqy",
      establishment: "Hospital Biprovincial Quillota Petorca (HBQP)"
    };

    function escapeHtml(str) {
      if (!str) return '';
      return str.toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    class ProjectManagerApp {
      constructor() {
        this.projects = [];
        this.viewMode = 'kanban';
        this.filterStatus = 'ALL';
        this.draggedId = null;
        this.supabase = null;

        this.initStorage();
        this.initSupabase();
        this.render();
      }

      initStorage() {
        const stored = localStorage.getItem('hbqp_projects_master');
        if (stored) {
          try { this.projects = JSON.parse(stored); } catch(e) { this.projects = []; }
        }
        if (!this.projects || this.projects.length === 0) {
          this.loadDefaultProjects();
        }
      }

      loadDefaultProjects() {
        this.projects = [
          { id: 7, codigo: "PROY-007", ticket: "D-3-40", tipologia: "PROYECTO", unidad: "Subdirección de Operaciones", solicitante: "Hospitalización Domiciliaria", ubicacion: "HD", piso: "3", pma: "D-3-40", requerimiento: "Conclusión de trabajos de infraestructura en oficinas, kitchenette y bodega", estado: "PENDIENTE", fecha_ingreso: "2026-02-02", fecha_actualizacion: "2026-06-16", descripcion: "Solicitud de modificación de proyecto", pendiente: "Reunión Programada 07/JULIO", prioridad: "ALTA" },
          { id: 12, codigo: "PROY-012", ticket: "G-S1-45", tipologia: "PROYECTO", unidad: "Farmacia CRD / Especialidades", solicitante: "Camila Aedo Jiménez", ubicacion: "Oficina farmacéuticos", piso: "-1", pma: "G-S1-45", requerimiento: "Propuestas de remodelación para oficina QF G-S1-45 y oficinas QF del Consultorio de Especialidades", estado: "PENDIENTE", fecha_ingreso: "2026-01-19", fecha_actualizacion: "2026-01-19", descripcion: "Remodelación oficina farmacéuticos", pendiente: "", prioridad: "MEDIA" },
          { id: 16, codigo: "PROY-016", ticket: "#66458", tipologia: "REPARACION", unidad: "UMQ", solicitante: "José Rocabado Jefe UMQ", ubicacion: "Terrazas 5to Piso", piso: "5", pma: "N-5-23", requerimiento: "Solicita instalación de Mallas en terrazas para el 5to Piso", estado: "PENDIENTE", fecha_ingreso: "2026-05-01", fecha_actualizacion: "2026-05-01", descripcion: "Mallas anticaídas terrazas", pendiente: "Planos y EE.TT", prioridad: "ALTA" },
          { id: 18, codigo: "PROY-018", ticket: "", tipologia: "PROYECTO", unidad: "UHYS", solicitante: "", ubicacion: "Bodega UHYS", piso: "-1", pma: "", requerimiento: "BODEGA UHYS", estado: "EN PROCESO", fecha_ingreso: "2026-04-27", fecha_actualizacion: "2026-05-27", descripcion: "Terminados tabiquería y terminaciones interiores", pendiente: "PUERTA Y CELOSIA", prioridad: "ALTA" },
          { id: 28, codigo: "PROY-028", ticket: "P-5-40", tipologia: "PROYECTO", unidad: "SALA PRE ALTA GO", solicitante: "Roxana Montino Bahamondes", ubicacion: "Sala de espera de familiares", piso: "5", pma: "P-5-40", requerimiento: "HABILITACION SALA DE PRE ALTA GINECO OBSTETRA", estado: "Propuesta enviada", fecha_ingreso: "2026-03-25", fecha_actualizacion: "2026-05-18", descripcion: "Habilitación sala pre alta", pendiente: "", prioridad: "ALTA" },
          { id: 38, codigo: "PROY-038", ticket: "", tipologia: "REPARACION", unidad: "Subdirección de Operaciones", solicitante: "Rafael", ubicacion: "Acceso Urgencia Adulto", piso: "1", pma: "", requerimiento: "FILTRACION URGENCIA ADULTO", estado: "TERMINADO", fecha_ingreso: "2026-05-10", fecha_actualizacion: "2026-05-12", descripcion: "Reparación de filtración activa en acceso", pendiente: "", prioridad: "MUY ALTA" }
        ];
        this.saveStorage();
      }

      saveStorage() {
        localStorage.setItem('hbqp_projects_master', JSON.stringify(this.projects));
        this.updateKPIs();
      }

      initSupabase() {
        if (window.supabase && SGM_CONFIG.supabaseUrl.startsWith("https://")) {
          try {
            this.supabase = window.supabase.createClient(SGM_CONFIG.supabaseUrl, SGM_CONFIG.supabaseAnonKey);
            this.supabase.channel('projects_realtime_hbqp')
              .on('postgres_changes', { event: '*', schema: 'public', table: 'projects_hbqp' }, () => this.fetchCloudProjects())
              .subscribe();
            this.fetchCloudProjects();
          } catch(e) {}
        }
      }

      async fetchCloudProjects() {
        if (!this.supabase) return;
        try {
          const { data, error } = await this.supabase.from('projects_hbqp').select('*');
          if (!error && data && data.length > 0) {
            this.projects = data.map(d => d.data);
            this.saveStorage();
            this.render();
          }
        } catch(e) {}
      }

      async syncCloud(project) {
        this.saveStorage();
        if (this.supabase) {
          try {
            await this.supabase.from('projects_hbqp').upsert({
              id: String(project.id),
              codigo: project.codigo,
              data: project,
              updated_at: new Date().toISOString()
            });
            this.showToast('Sincronizado con Supabase');
          } catch(e) { this.showToast('Guardado localmente', '💾'); }
        } else {
          this.showToast('Guardado localmente', '💾');
        }
      }

      showToast(msg, icon = '✅') {
        const c = document.getElementById('toastContainer');
        const t = document.createElement('div');
        t.className = 'bg-slate-900 text-white px-4 py-2 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2 border border-slate-700';
        t.innerHTML = `<span>${icon}</span> <span>${escapeHtml(msg)}</span>`;
        c.appendChild(t);
        setTimeout(() => t.remove(), 2600);
      }

      normalizeStatus(st) {
        if (!st) return 'PENDIENTE';
        const u = st.toUpperCase();
        if (u.includes('PENDIENTE')) return 'PENDIENTE';
        if (u.includes('PROPUESTA')) return 'Propuesta enviada';
        if (u.includes('PROCESO') || u.includes('EJECUC')) return 'EN PROCESO';
        if (u.includes('TERMINADO') || u.includes('LISTO')) return 'TERMINADO';
        return 'PENDIENTE';
      }

      updateKPIs() {
        const total = this.projects.length;
        const pending = this.projects.filter(p => this.normalizeStatus(p.estado) === 'PENDIENTE').length;
        const propuesta = this.projects.filter(p => this.normalizeStatus(p.estado) === 'Propuesta enviada').length;
        const process = this.projects.filter(p => this.normalizeStatus(p.estado) === 'EN PROCESO').length;
        const done = this.projects.filter(p => this.normalizeStatus(p.estado) === 'TERMINADO').length;

        document.getElementById('stat-total').innerText = total;
        document.getElementById('stat-pending').innerText = pending;
        document.getElementById('stat-propuesta').innerText = propuesta;
        document.getElementById('stat-process').innerText = process;
        document.getElementById('stat-done').innerText = done;
      }

      setViewMode(mode) {
        this.viewMode = mode;
        const btnK = document.getElementById('btnViewKanban');
        const btnC = document.getElementById('btnViewCards');
        const btnT = document.getElementById('btnViewTable');

        [btnK, btnC, btnT].forEach(b => {
          b.className = "px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition";
        });

        if (mode === 'kanban') btnK.className = "px-3 py-1.5 rounded-md bg-white text-indigo-600 shadow-sm transition";
        if (mode === 'cards') btnC.className = "px-3 py-1.5 rounded-md bg-white text-indigo-600 shadow-sm transition";
        if (mode === 'table') btnT.className = "px-3 py-1.5 rounded-md bg-white text-indigo-600 shadow-sm transition";

        this.render();
      }

      setFilterStatus(st) { this.filterStatus = st; this.render(); }
      clearFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('filterTipologia').value = '';
        document.getElementById('filterPiso').value = '';
        document.getElementById('filterPrioridad').value = '';
        this.filterStatus = 'ALL';
        this.render();
      }
      resetView() { this.clearFilters(); this.setViewMode('kanban'); }

      getFilteredProjects() {
        const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
        const tipo = (document.getElementById('filterTipologia').value || '').toUpperCase();
        const piso = document.getElementById('filterPiso').value;
        const prio = (document.getElementById('filterPrioridad').value || '').toUpperCase();

        return this.projects.filter(p => {
          const norm = this.normalizeStatus(p.estado);
          const matchQ = !q ||
            (p.codigo && p.codigo.toLowerCase().includes(q)) ||
            (p.requerimiento && p.requerimiento.toLowerCase().includes(q)) ||
            (p.unidad && p.unidad.toLowerCase().includes(q)) ||
            (p.solicitante && p.solicitante.toLowerCase().includes(q)) ||
            (p.ubicacion && p.ubicacion.toLowerCase().includes(q)) ||
            (p.pma && p.pma.toLowerCase().includes(q));

          const matchStatus = this.filterStatus === 'ALL' || norm === this.filterStatus;
          const matchTipo = !tipo || (p.tipologia && p.tipologia.toUpperCase().includes(tipo));
          const matchPiso = !piso || (p.piso && String(p.piso).includes(piso));
          const matchPrio = !prio || (p.prioridad && p.prioridad.toUpperCase().includes(prio));

          return matchQ && matchStatus && matchTipo && matchPiso && matchPrio;
        });
      }

      getTipologiaBadge(tipo) {
        if (!tipo) return '';
        const u = tipo.toUpperCase();
        if (u.includes('PROYECTO')) return '<span class="px-2 py-0.5 text-[10px] font-bold rounded badge-proyecto">PROYECTO</span>';
        if (u.includes('REPARACION')) return '<span class="px-2 py-0.5 text-[10px] font-bold rounded badge-reparacion">REPARACIÓN</span>';
        if (u.includes('APOYO')) return '<span class="px-2 py-0.5 text-[10px] font-bold rounded badge-apoyo">APOYO TÉCNICO</span>';
        return `<span class="px-2 py-0.5 text-[10px] font-bold rounded bg-slate-100 text-slate-700">${escapeHtml(tipo)}</span>`;
      }

      getPrioridadBadge(prio) {
        if (!prio) return '';
        const u = prio.toUpperCase();
        if (u.includes('MUY ALTA')) return '<span class="px-1.5 py-0.5 text-[9px] font-bold rounded bg-rose-600 text-white uppercase"><i class="fa-solid fa-angles-up mr-0.5"></i> Muy Alta</span>';
        if (u.includes('ALTA')) return '<span class="px-1.5 py-0.5 text-[9px] font-bold rounded bg-amber-500 text-white uppercase"><i class="fa-solid fa-angle-up mr-0.5"></i> Alta</span>';
        if (u.includes('BAJA')) return '<span class="px-1.5 py-0.5 text-[9px] font-bold rounded bg-slate-200 text-slate-600 uppercase">Baja</span>';
        return '<span class="px-1.5 py-0.5 text-[9px] font-bold rounded bg-blue-100 text-blue-700 uppercase">Media</span>';
      }

      render() {
        const container = document.getElementById('mainContainer');
        const items = this.getFilteredProjects();
        this.updateKPIs();

        if (this.viewMode === 'kanban') {
          this.renderKanban(container, items);
        } else if (this.viewMode === 'cards') {
          this.renderCards(container, items);
        } else {
          this.renderTable(container, items);
        }
      }

      renderKanban(container, items) {
        const columns = [
          { key: 'PENDIENTE', title: 'En Evaluación / Pendientes', color: 'bg-amber-500', badge: 'bg-amber-100 text-amber-900' },
          { key: 'Propuesta enviada', title: 'Propuesta Enviada', color: 'bg-blue-500', badge: 'bg-blue-100 text-blue-900' },
          { key: 'EN PROCESO', title: 'En Ejecución / Obras', color: 'bg-indigo-500', badge: 'bg-indigo-100 text-indigo-900' },
          { key: 'TERMINADO', title: 'Concluidos / Entregados', color: 'bg-emerald-500', badge: 'bg-emerald-100 text-emerald-900' }
        ];

        let html = '<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 items-start">';
        columns.forEach(col => {
          const colItems = items.filter(p => this.normalizeStatus(p.estado) === col.key);
          html += `
            <div class="kanban-col shadow-sm">
              <div class="flex items-center justify-between pb-2 mb-2.5 border-b border-slate-300">
                <div class="flex items-center gap-2">
                  <span class="w-3 h-3 rounded-full ${col.color}"></span>
                  <h2 class="font-bold text-xs text-slate-800 tracking-wide uppercase">${col.title}</h2>
                </div>
                <span class="text-xs font-bold px-2 py-0.5 rounded-full ${col.badge}">${colItems.length}</span>
              </div>
              <div class="kanban-cards-wrapper custom-scroll" 
                   ondragover="event.preventDefault(); this.classList.add('drag-over');"
                   ondragleave="this.classList.remove('drag-over');"
                   ondrop="window.pmApp.handleDrop(event, '${col.key}')">
                ${colItems.map(p => this.renderProjectCard(p)).join('')}
              </div>
            </div>
          `;
        });
        html += '</div>';
        container.innerHTML = html;
      }

      renderProjectCard(p) {
        return `
          <div class="project-card group" draggable="true"
               ondragstart="window.pmApp.draggedId = ${p.id}"
               onclick="window.pmApp.openEditModal(${p.id})">
            <div class="flex items-center justify-between gap-1 mb-2">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="font-black text-xs text-slate-900">${escapeHtml(p.codigo || 'PROY-' + p.id)}</span>
                ${this.getTipologiaBadge(p.tipologia)}
              </div>
              ${this.getPrioridadBadge(p.prioridad)}
            </div>

            <h3 class="text-xs font-bold text-slate-900 leading-snug mb-2 group-hover:text-indigo-600 transition line-clamp-3">
              ${escapeHtml(p.requerimiento || p.descripcion)}
            </h3>

            ${p.unidad ? `<p class="text-[11px] text-slate-600 font-semibold truncate mb-1.5 flex items-center gap-1">
              <i class="fa-solid fa-building text-[10px] text-slate-400"></i>
              <span class="truncate">${escapeHtml(p.unidad)}</span>
            </p>` : ''}

            <div class="flex items-center gap-1 flex-wrap mb-2 text-[10px] text-slate-600">
              ${p.piso ? `<span class="bg-slate-100 px-1.5 py-0.5 rounded font-medium">Piso ${escapeHtml(p.piso)}</span>` : ''}
              ${p.ubicacion ? `<span class="bg-slate-100 px-1.5 py-0.5 rounded truncate max-w-[130px] font-medium">${escapeHtml(p.ubicacion)}</span>` : ''}
              ${p.pma ? `<span class="bg-cyan-50 text-cyan-800 px-1.5 py-0.5 rounded border border-cyan-200 font-bold">PMA: ${escapeHtml(p.pma)}</span>` : ''}
            </div>

            ${p.pendiente ? `
              <div class="p-2 bg-amber-50 rounded-lg border border-amber-200 text-[10px] text-amber-900 font-bold mb-2 flex items-start gap-1.5">
                <i class="fa-solid fa-triangle-exclamation text-amber-600 mt-0.5"></i>
                <span class="line-clamp-2">${escapeHtml(p.pendiente)}</span>
              </div>` : ''}

            <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-400">
              <span>${p.fecha_ingreso || ''}</span>
              <span class="text-indigo-600 font-bold opacity-0 group-hover:opacity-100 transition">Ver Ficha →</span>
            </div>
          </div>
        `;
      }

      renderCards(container, items) {
        container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${items.map(p => this.renderProjectCard(p)).join('')}</div>`;
      }

      renderTable(container, items) {
        container.innerHTML = `
          <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
            <div class="overflow-x-auto custom-scroll">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200 uppercase">
                  <tr>
                    <th class="p-3">Código</th>
                    <th class="p-3">Tipología</th>
                    <th class="p-3">Requerimiento</th>
                    <th class="p-3">Unidad</th>
                    <th class="p-3">Piso / Recinto</th>
                    <th class="p-3">PMA</th>
                    <th class="p-3">Pendiente</th>
                    <th class="p-3">Fase</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${items.map(p => `
                    <tr class="hover:bg-slate-50 cursor-pointer transition" onclick="window.pmApp.openEditModal(${p.id})">
                      <td class="p-3 font-black text-indigo-700">${escapeHtml(p.codigo || 'PROY-' + p.id)}</td>
                      <td class="p-3">${this.getTipologiaBadge(p.tipologia)}</td>
                      <td class="p-3 font-bold max-w-xs truncate">${escapeHtml(p.requerimiento || p.descripcion)}</td>
                      <td class="p-3 text-slate-600">${escapeHtml(p.unidad || '-')}</td>
                      <td class="p-3 text-slate-600">Piso ${escapeHtml(p.piso || '-')} · ${escapeHtml(p.ubicacion || '')}</td>
                      <td class="p-3 font-mono">${escapeHtml(p.pma || '-')}</td>
                      <td class="p-3 font-bold text-amber-700">${escapeHtml(p.pendiente || '-')}</td>
                      <td class="p-3 font-bold">${escapeHtml(p.estado)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      handleDrop(e, newStatus) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        if (!this.draggedId) return;

        const p = this.projects.find(item => item.id == this.draggedId);
        if (p && this.normalizeStatus(p.estado) !== newStatus) {
          p.estado = newStatus;
          p.fecha_actualizacion = new Date().toISOString().split('T')[0];
          this.syncCloud(p);
          this.render();
          this.showToast(`Proyecto ${p.codigo} movido a ${newStatus}`);
        }
        this.draggedId = null;
      }

      openNewProjectModal() {
        document.getElementById('projectForm').reset();
        document.getElementById('formProjectId').value = '';
        const nextId = this.projects.length > 0 ? Math.max(...this.projects.map(p => Number(p.id) || 0)) + 1 : 1;
        document.getElementById('formCodigo').value = `PROY-${String(nextId).padStart(3, '0')}`;
        document.getElementById('modalProjectTitle').innerText = 'Nuevo Proyecto de Infraestructura';
        document.getElementById('btnDeleteProject').classList.add('hidden');
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('formFechaIngreso').value = today;
        document.getElementById('formFechaActualizacion').value = today;
        document.getElementById('projectModal').classList.remove('hidden');
      }

      openEditModal(id) {
        const p = this.projects.find(item => item.id == id);
        if (!p) return;
        document.getElementById('formProjectId').value = p.id;
        document.getElementById('formCodigo').value = p.codigo || `PROY-${p.id}`;
        document.getElementById('formTicket').value = p.ticket || '';
        document.getElementById('formTipologia').value = p.tipologia || 'PROYECTO';
        document.getElementById('formPrioridad').value = p.prioridad || 'MEDIA';
        document.getElementById('formRequerimiento').value = p.requerimiento || p.descripcion || '';
        document.getElementById('formUnidad').value = p.unidad || '';
        document.getElementById('formSolicitante').value = p.solicitante || '';
        document.getElementById('formPiso').value = p.piso || '';
        document.getElementById('formUbicacion').value = p.ubicacion || '';
        document.getElementById('formPMA').value = p.pma || '';
        document.getElementById('formEstado').value = p.estado || 'PENDIENTE';
        document.getElementById('formFechaIngreso').value = p.fecha_ingreso || '';
        document.getElementById('formFechaActualizacion').value = p.fecha_actualizacion || '';
        document.getElementById('formPendiente').value = p.pendiente || '';
        document.getElementById('formDescripcion').value = p.descripcion || '';
        document.getElementById('modalProjectTitle').innerText = `Ficha Técnica: ${p.codigo || 'PROY-' + p.id}`;
        document.getElementById('btnDeleteProject').classList.remove('hidden');
        document.getElementById('btnShareWhatsAppModal').onclick = () => this.shareWhatsApp(p.id);
        document.getElementById('projectModal').classList.remove('hidden');
      }

      closeModal() { document.getElementById('projectModal').classList.add('hidden'); }

      saveProject(e) {
        e.preventDefault();
        const id = document.getElementById('formProjectId').value;
        const today = new Date().toISOString().split('T')[0];
        const data = {
          codigo: document.getElementById('formCodigo').value.trim(),
          ticket: document.getElementById('formTicket').value.trim(),
          tipologia: document.getElementById('formTipologia').value,
          prioridad: document.getElementById('formPrioridad').value,
          requerimiento: document.getElementById('formRequerimiento').value.trim(),
          unidad: document.getElementById('formUnidad').value.trim(),
          solicitante: document.getElementById('formSolicitante').value.trim(),
          piso: document.getElementById('formPiso').value.trim(),
          ubicacion: document.getElementById('formUbicacion').value.trim(),
          pma: document.getElementById('formPMA').value.trim(),
          estado: document.getElementById('formEstado').value,
          fecha_ingreso: document.getElementById('formFechaIngreso').value || today,
          fecha_actualizacion: today,
          pendiente: document.getElementById('formPendiente').value.trim(),
          descripcion: document.getElementById('formDescripcion').value.trim()
        };

        if (id) {
          const idx = this.projects.findIndex(p => p.id == id);
          if (idx !== -1) {
            this.projects[idx] = { ...this.projects[idx], ...data };
            this.syncCloud(this.projects[idx]);
          }
        } else {
          const newId = this.projects.length > 0 ? Math.max(...this.projects.map(p => Number(p.id) || 0)) + 1 : 1;
          const newProj = { id: newId, ...data };
          this.projects.unshift(newProj);
          this.syncCloud(newProj);
        }
        this.closeModal();
        this.render();
      }

      deleteProject() {
        const id = document.getElementById('formProjectId').value;
        if (!id) return;
        if (confirm('¿Estás seguro de eliminar este proyecto?')) {
          this.projects = this.projects.filter(p => p.id != id);
          if (this.supabase) {
            try { this.supabase.from('projects_hbqp').delete().eq('id', String(id)); } catch(e) {}
          }
          this.saveStorage();
          this.closeModal();
          this.render();
          this.showToast('Proyecto eliminado');
        }
      }

      exportCSV() {
        const headers = ["Código", "N° Ticket", "Tipología", "Unidad Solicitante", "Solicitante", "Piso", "Recinto", "PMA", "Requerimiento", "Estado", "Hito Pendiente", "Prioridad"];
        const rows = this.projects.map(p => [
          p.codigo,
          `"${(p.ticket || '').replace(/"/g, '""')}"`,
          p.tipologia || '',
          `"${(p.unidad || '').replace(/"/g, '""')}"`,
          `"${(p.solicitante || '').replace(/"/g, '""')}"`,
          p.piso || '',
          `"${(p.ubicacion || '').replace(/"/g, '""')}"`,
          p.pma || '',
          `"${(p.requerimiento || p.descripcion || '').replace(/"/g, '""')}"`,
          p.estado || '',
          `"${(p.pendiente || '').replace(/"/g, '""')}"`,
          p.prioridad || ''
        ]);
        const csv = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const a = document.createElement("a");
        a.href = encodeURI(csv);
        a.download = `Proyectos_HBQP_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      generateExecutiveReportPDF() {
        if (!window.jspdf) return;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(14);
        doc.text("INFORME DE PROYECTOS DE INFRAESTRUCTURA - HBQP", 14, 15);
        doc.setFontSize(8);
        doc.text(`Total registros: ${this.projects.length} | Fecha: ${new Date().toLocaleDateString()}`, 14, 21);
        doc.autoTable({
          head: [["Código", "Tipología", "Unidad", "Requerimiento", "Piso", "PMA", "Estado", "Pendiente"]],
          body: this.projects.map(p => [p.codigo, p.tipologia, p.unidad, p.requerimiento, p.piso, p.pma, p.estado, p.pendiente]),
          startY: 26,
          theme: 'grid',
          styles: { fontSize: 7 }
        });
        doc.save(`Informe_Proyectos_HBQP.pdf`);
      }

      shareWhatsApp(id) {
        const p = this.projects.find(item => item.id == id);
        if (!p) return;
        const msg = `*HBQP - INFRAESTRUCTURA & OPERACIONES*\n*PROYECTO: ${p.codigo || 'PROY-' + p.id}*\n------------------------\n📌 *Tipología:* ${p.tipologia}\n🏢 *Unidad:* ${p.unidad || 'N/A'}\n📍 *Emplazamiento:* Piso ${p.piso || 'N/A'} - ${p.ubicacion || 'N/A'} (PMA: ${p.pma || 'N/A'})\n📊 *Fase:* ${p.estado}\n------------------------\n📝 *Requerimiento:*\n${p.requerimiento || p.descripcion}\n${p.pendiente ? `\n⚠️ *Hito Pendiente:*\n${p.pendiente}` : ''}`;
        const a = document.createElement('a');
        a.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
        a.target = "_blank";
        a.click();
      }
    }

    window.addEventListener('DOMContentLoaded', () => { window.pmApp = new ProjectManagerApp(); });
  </script>
</body>
</html>
